name: Visual check

# Forks never run this: they have no secrets, and it would run untrusted code.
on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches-ignore: [main]

concurrency:
    group: visual-check-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions: {}

env:
    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
    start:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            statuses: write
        steps:
            - run: gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context=visual-regression -f description="Capturing stories" -f target_url="$RUN_URL"
              env:
                  GH_TOKEN: ${{ github.token }}

    # build, capture and compare run the PR's dependencies and build, so they have no write access and no secrets.
    build:
        needs: start
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container: mcr.microsoft.com/playwright:v1.55.0-noble
        permissions:
            contents: read
        outputs:
            base-sha: ${{ steps.base.outputs.sha }}
            base-key: ${{ steps.lookup.outputs.cache-primary-key }}
            base-saved: ${{ steps.lookup.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - run: npm ci

            # The report page is committed as one built file, so make sure it matches its source.
            # A branch from before the built page has no source to check, and the published page comes from the base anyway.
            - run: |
                  if [ ! -f scripts/visual/report/vite.config.ts ]; then
                      echo "::notice::This branch has no report page source yet, so the page check is skipped."
                      exit 0
                  fi
                  npm run visual:page
                  if [ -n "$(git status --porcelain -- scripts/visual/report/dist)" ]; then
                      echo "::error::The report page is out of date. Run npm run visual:page and commit the result."
                      exit 1
                  fi

            # The event's base is staging as it was at this push. Staging fetched now can already hold
            # this PR if it merged meanwhile, and the merge-base would then be the PR's own head.
            - id: base
              run: echo "sha=$(git merge-base "$EVENT_BASE_SHA" HEAD)" >> "$GITHUB_OUTPUT"
              env:
                  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}

            - id: lookup
              uses: actions/cache/restore@v6
              with:
                  path: visual-output/base
                  key: visual-base-${{ steps.base.outputs.sha }}-${{ hashFiles('scripts/visual/capture.ts', 'scripts/visual/stories.ts', 'scripts/visual/config.ts') }}-pw1.55.0-sb
                  lookup-only: true

            - run: npm run visual:ci -- build

            - uses: actions/upload-artifact@v7
              with:
                  name: visual-storybook
                  path: storybook-static
                  retention-days: 1
                  if-no-files-found: error

            # No saved captures for the base, so the capture jobs take them too.
            - if: steps.lookup.outputs.cache-hit != 'true'
              run: npm run visual:ci -- build-base --base "$BASE_SHA"
              env:
                  BASE_SHA: ${{ steps.base.outputs.sha }}

            - if: steps.lookup.outputs.cache-hit != 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: visual-base-storybook
                  path: visual-output/base-storybook
                  retention-days: 1
                  if-no-files-found: error

    capture:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        container: mcr.microsoft.com/playwright:v1.55.0-noble
        permissions:
            contents: read
        strategy:
            matrix:
                share: [1, 2, 3, 4, 5, 6]
        env:
            SHARE: ${{ strategy.job-index }}/${{ strategy.job-total }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - run: npm ci

            - uses: actions/download-artifact@v8
              with:
                  name: visual-storybook
                  path: storybook-static

            - run: npm run visual:ci -- capture --share "$SHARE" --storybook storybook-static --out visual-output/head

            - uses: actions/upload-artifact@v7
              with:
                  name: visual-head-share-${{ strategy.job-index }}
                  path: visual-output/head
                  retention-days: 1
                  compression-level: 0
                  if-no-files-found: error

            - if: needs.build.outputs.base-saved != 'true'
              uses: actions/download-artifact@v8
              with:
                  name: visual-base-storybook
                  path: visual-output/base-storybook

            - if: needs.build.outputs.base-saved != 'true'
              run: npm run visual:ci -- capture --share "$SHARE" --storybook visual-output/base-storybook --out visual-output/base

            - if: needs.build.outputs.base-saved != 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: visual-base-share-${{ strategy.job-index }}
                  path: visual-output/base
                  retention-days: 1
                  compression-level: 0
                  if-no-files-found: error

    compare:
        needs: [build, capture]
        runs-on: ubuntu-latest
        # Captures the whole base in this one job if its saved captures were dropped since build looked them up.
        timeout-minutes: 60
        container: mcr.microsoft.com/playwright:v1.55.0-noble
        permissions:
            contents: read
        env:
            BASE_SHA: ${{ needs.build.outputs.base-sha }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - run: npm ci

            - uses: actions/download-artifact@v8
              with:
                  name: visual-storybook
                  path: storybook-static

            - uses: actions/download-artifact@v8
              with:
                  pattern: visual-head-share-*
                  merge-multiple: true
                  path: visual-output/head

            - run: npm run visual:ci -- join --storybook storybook-static --dir visual-output/head --sha "$HEAD_SHA"

            - id: restore
              if: needs.build.outputs.base-saved == 'true'
              uses: actions/cache/restore@v6
              with:
                  path: visual-output/base
                  key: ${{ needs.build.outputs.base-key }}

            # Kept inside the base folder, so the cache saves it for the base recheck.
            - if: needs.build.outputs.base-saved != 'true'
              uses: actions/download-artifact@v8
              with:
                  name: visual-base-storybook
                  path: visual-output/base/storybook

            - if: needs.build.outputs.base-saved != 'true'
              uses: actions/download-artifact@v8
              with:
                  pattern: visual-base-share-*
                  merge-multiple: true
                  path: visual-output/base

            - if: needs.build.outputs.base-saved != 'true'
              run: npm run visual:ci -- join --storybook visual-output/base/storybook --dir visual-output/base --sha "$BASE_SHA"

            # Builds the base itself if the saved captures were dropped since build looked them up.
            - run: npm run visual:ci -- compare --base "$BASE_SHA"

            - if: steps.restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: visual-output/base
                  key: ${{ needs.build.outputs.base-key }}

            - uses: actions/upload-artifact@v7
              with:
                  name: visual-report
                  path: visual-output/report
                  retention-days: 1

    # Installs nothing and builds nothing. Only this job holds the deploy key, so it runs the
    # scripts from the base commit: a PR's own changes to them never see the key.
    publish:
        needs: compare
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            statuses: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  sparse-checkout: scripts/visual

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - uses: actions/download-artifact@v8
              with:
                  name: visual-report
                  path: report-data

            - run: node scripts/visual/publish.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPORT_DIR: report-data
                  REPORTS_REPO: CodeGetItGR/storywall-visual-reports
                  PAGES_BASE_URL: https://codegetitgr.github.io/storywall-visual-reports
                  VISUAL_REPORTS_DEPLOY_KEY: ${{ secrets.VISUAL_REPORTS_DEPLOY_KEY }}
                  VISUAL_APPROVERS: ${{ vars.VISUAL_APPROVERS }}

    finish:
        needs: [start, build, capture, compare, publish]
        if: failure() || cancelled()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            statuses: write
        steps:
            - run: gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=error -f context=visual-regression -f description="The visual check could not finish" -f target_url="$RUN_URL"
              env:
                  GH_TOKEN: ${{ github.token }}
