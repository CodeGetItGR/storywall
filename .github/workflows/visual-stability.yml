name: Visual stability test (temporary)

on:
    pull_request:
        branches: [staging]

permissions:
    contents: read

jobs:
    capture:
        strategy:
            fail-fast: false
            matrix:
                run: [1, 2, 3]
        runs-on: ubuntu-latest
        timeout-minutes: 45
        container: mcr.microsoft.com/playwright:v1.55.0-noble
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - run: npm ci
            - run: npm run visual -- --capture-only
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: captures-${{ matrix.run }}
                  path: visual-output/base
                  retention-days: 3

    compare:
        needs: capture
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: actions/download-artifact@v8
              with:
                  pattern: captures-*
                  path: runs
            - run: node scripts/visual/stability.mjs runs/captures-1 runs/captures-2 runs/captures-3
